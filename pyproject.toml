[project]
name = "flask-api"
version = "0.1.0"
description = "API REST e-commerce DigiMarket (Flask + SQLAlchemy + JWT) — projet Blent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.1.3",
    "flask-sqlalchemy>=3.1.1",
    "marshmallow>=4.3.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.50",
    "werkzeug>=3.1.8",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "flake8>=7.3.0",
    "pre-commit>=4.6.0",
    "pytest>=9.1.1",
]

[tool.black]
target-version = ["py312"]
