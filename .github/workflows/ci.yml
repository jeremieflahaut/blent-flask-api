name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Check formatting (black)
        run: uv run black --check .

      - name: Lint (flake8)
        run: uv run flake8 .

      - name: Run tests (pytest)
        run: uv run pytest
